<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>README.md Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <meta name="google-site-verification" content="UiNxcMOOr2r_PibYsQ5tFrMZMqIK04_eI33N9JLjHOI" />
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 README.md Generator</h1>
            <p>Create professional README files instantly with live preview</p>
        </header>

        <div class="main-content">
            <div class="column left-column">
                <h2>Input Form</h2>
                <form id="readme-form">
                    <div class="form-group">
                        <label for="project-title">Project Title</label>
                        <input type="text" id="project-title" placeholder="My Awesome Project">
                    </div>

                    <div class="form-group">
                        <label for="description">One-Line Description</label>
                        <input type="text" id="description" placeholder="A brief description of what this project does">
                    </div>

                    <div class="form-group">
                        <label for="tech-stack">Tech Stack (one per line)</label>
                        <textarea id="tech-stack" placeholder="React&#10;Node.js&#10;MongoDB&#10;Express"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="installation">Installation Steps</label>
                        <textarea id="installation" placeholder="npm install&#10;npm start"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="usage">Usage Example</label>
                        <textarea id="usage" placeholder="import MyComponent from './MyComponent';&#10;&#10;<MyComponent />"></textarea>
                    </div>
                </form>
            </div>

            <div class="column middle-column">
                <h2>Raw Markdown Output</h2>
                <pre id="output-preview" class="placeholder-text">Your README.md will appear here as you type...</pre>
                <button id="copy-btn">📋 Copy to Clipboard</button>
            </div>

            <div class="column right-column">
                <h2>Live Preview</h2>
                <div id="live-preview" class="placeholder-text">
                    Rendered markdown preview will appear here...
                </div>
            </div>
        </div>
    </div>
</body>
</html>
